[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-bgremove"
version = "0.2.0"
description = "Offline ONNX background removal"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "Pillow>=10.4", "opencv-python-headless>=4.10", "onnxruntime>=1.20", "typer>=0.15", "platformdirs>=4", "psutil>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "onnx>=1.17", "types-Pillow", "types-psutil"]
heic = ["pillow-heif"]
matting = ["pymatting>=1.1.12"]

[project.scripts]
bgremove = "bgremove.cli:app"

[tool.setuptools.package-data]
bgremove = ["models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
